[package]
name = "rust-hypervisor"
version = "0.1.0"
authors = ["Yuekai Jia <yuekai.jyk@antgroup.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
intel = ["libvmm/vmx"]
amd = ["libvmm/svm"]
stats = []
sme = ["amd"]
enclave_interrupt = []
epc48 = []
epc96 = []
epc144 = []
epc192 = []
epc240 = []
epc288 = []
epc336 = []
epc384 = []

[dependencies]
log = "0.4.33"
spin = "0.12.2"
bitflags = "2.13.1"
bit_field = "0.10.3"
numeric-enum-macro = "0.2"
paste = "1.0.15"
buddy_system_allocator = "0.13.0"
libvmm = { path = "./crates/libvmm", default-features = false }
uart_16550 = { path = "./crates/uart_16550" }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
bitmap-allocator = { git = "https://github.com/rcore-os/bitmap-allocator", rev = "03bd9909" }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
cty = "0.2.1"
cstr_core = "0.2.6"
yogcrypt = { path = "./crates/yogcrypt" }
static_assertions = "1.1.0"
memoffset = "0.9.1"
vstd = { version = "0.0.0-2025-08-12-1837", default-features = false, features = ["alloc"] }
verified-hv-mem = { git = "https://github.com/LiuJun5817/verified-hv-mem", rev = "ec17cc5" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52.0"
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
raw-cpuid = "11.6.0"
